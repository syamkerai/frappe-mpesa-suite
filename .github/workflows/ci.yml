name: CI

on:
  push:
    branches:
      - develop
      - astral-suite
      - 'version-*'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Pure-Python helpers (phone, callback guard, STK payload rules): no bench needed, runs in seconds.
    name: Unit (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install pytest requests openpyxl  # openpyxl: the wallet statement-file tests
      - run: pytest -q tests/unit

  server:
    name: Server (Frappe ${{ matrix.frappe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            python: '3.11'
            node: 18
          - frappe: version-16
            python: '3.14'
            node: 24

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install MariaDB Client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch ${{ matrix.frappe }} --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app erpnext --branch ${{ matrix.frappe }}
          bench get-app payments --branch ${{ matrix.frappe }} || bench get-app payments --branch develop
          bench get-app hrms --branch ${{ matrix.frappe }}
          bench get-app lending --branch ${{ matrix.frappe }} || echo "lending not available for ${{ matrix.frappe }}; loan features skipped"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_mpsa_payments $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext payments hrms
          if [ -d apps/lending ]; then bench --site test_site install-app lending; fi
          bench --site test_site install-app frappe_mpsa_payments
          bench --site test_site migrate
          bench build --app frappe_mpsa_payments
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_mpsa_payments
        env:
          TYPE: server
